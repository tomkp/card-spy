name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install PC/SC headers (the smartcard native module builds against them)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: npm ci
      - run: npm run checks
      - run: npm run build
